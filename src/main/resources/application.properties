spring.application.name=acessoja

# Todos os endpoints ficam sob /api/v1 (a planilha de endpoints usa esse prefixo)
server.servlet.context-path=/api/v1

# Inclui a mensagem das ResponseStatusException no corpo dos erros da API (como no projeto Soulpass)
spring.web.error.include-message=always

# A Render informa a porta pela variável PORT; localmente usa 8080
server.port=${PORT:8080}

# Upload de foto: limite de 5 MB por foto (RNF08). Request um pouco maior por causa dos outros campos.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Pasta onde as fotos dos avisos são gravadas (veja FotoService)
acessoja.upload.pasta=uploads

# Origens liberadas no CORS (o protótipo roda no Live Server, portas 5500 e 5501).
# Em produção, acrescente o endereço do site publicado, separado por vírgula.
acessoja.cors.origens=http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:5501,http://localhost:5501

# A conexão com o Oracle é feita pela classe dao/ConnectionFactory (URL, usuário e senha).
# As regras numéricas (3 confirmações, 5 avisos por dia, 10 minutos de duplicidade) ficam como constantes
# nos services: ConfirmacaoService.MINIMO_CONFIRMACOES, AvisoService.LIMITE_AVISOS_DIA e AvisoService.DUPLICADO_MINUTOS.
